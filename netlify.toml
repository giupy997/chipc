# Il sito e' in docs/, non nella root del repo: senza questa riga Netlify
# pubblica la root, non ci trova un index.html e risponde 404 su ogni path.
# Questo file ha la precedenza sulla publish directory impostata nella UI.

[build]
  publish = "docs"
  # Sito statico: non c'e' niente da compilare. La netlist per il browser
  # (docs/rh4-data.js) e' generata da `make site` e committata.
  command = ""
  # Le funzioni stanno fuori da docs/: non vanno servite come file statici,
  # Netlify le monta come endpoint (vedi il `config.path` dentro pin.mjs).
  functions = "netlify/functions"
  # Una build costa crediti: si costruisce solo se e' cambiato qualcosa che il
  # sito serve davvero (docs/, le functions, questo file). Contratti, test,
  # plugin e strumenti non toccano il sito e non devono farlo ricostruire.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- docs netlify netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# La netlist non cambia se non cambia il processore, ma index.html si'.
[[headers]]
  for = "/rh4-data.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
